[project]
name = "Sherpa"
version = "0.1.0"
description = "Default template for PDM package"
authors = [
    {name = "Luis Carlos Quesada", email = "luiscarlosquesada@icloud.com"},
]
dependencies = ["uvicorn>=0.35.0", "fastapi>=0.115.14", "pydantic>=2.11.7", "langchain>=0.3.26", "langgraph>=0.5.1", "langsmith>=0.4.4", "streamlit>=1.46.1", "qdrant-client>=1.14.3", "langchain-community>=0.3.27"]
requires-python = "==3.13.*"
readme = "README.md"
license = {text = "MIT"}


[tool.pdm]
distribution = false


[tool.pdm.scripts]

# Pull both models
install-models = { shell = "ollama pull llama3 && ollama pull mxbai-embed-large" }

# Stop both models gracefully
stop-models = { shell = "curl -s http://localhost:11434/api/stop -d '{\"model\": \"llama3\"}' && curl -s http://localhost:11434/api/stop -d '{\"model\": \"mxbai-embed-large\"}'" }
